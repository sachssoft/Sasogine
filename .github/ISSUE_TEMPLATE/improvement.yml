name: 🔧 Improvement
description: Suggest an improvement to existing functionality
title: "IMPROVEMENT: "
labels:
  - improvement
assignees:
  - Sachssoft

body:
  - type: textarea
    id: description
    attributes:
      label: "📝 Description"
      placeholder: "Describe what should be improved and why."
    validations:
      required: true

  - type: textarea
    id: current
    attributes:
      label: "📌 Current behavior"
      placeholder: "Describe the current behavior or implementation."

  - type: textarea
    id: proposed
    attributes:
      label: "💡 Proposed improvement"
      placeholder: "Describe how it could be improved."

  - type: textarea
    id: additional
    attributes:
      label: "📎 Additional information"
      placeholder: "Add any relevant context, examples, or references."