name: ♻️ Refactor
description: Suggest an internal code or architecture refactoring
title: "REFACTOR: "
labels:
  - refactor
assignees:
  - Sachssoft

body:
  - type: textarea
    id: description
    attributes:
      label: "📝 Description"
      placeholder: "Describe what should be refactored."
    validations:
      required: true

  - type: textarea
    id: reason
    attributes:
      label: "🎯 Reason"
      placeholder: "Explain why the refactoring is needed."

  - type: textarea
    id: proposed
    attributes:
      label: "🔨 Proposed changes"
      placeholder: "Describe the proposed architectural or code changes."

  - type: textarea
    id: additional
    attributes:
      label: "📎 Additional information"
      placeholder: "Add relevant code, references, or implementation notes."